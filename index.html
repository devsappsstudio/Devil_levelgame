<html lang="en"><head><meta charset="utf-8">

<title>Devil Level 2</title>
<style>
:root{--bg:#07050f;--fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="light"]{--bg:#d9dcee}

.tb{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:72px;height:72px;border-radius:50%;border:2px solid #fff7;background:#ffffff2a;color:#fff;font-size:26px;font-weight:800}
</style></head><body>
<canvas id="c"></canvas>
<div id="tc"><button class="tb" style="left:14px" data-k="left">◀</button><button class="tb" style="left:98px" data-k="right">▶</button><button class="tb" style="right:16px" data-k="jump">▲</button></div>
<script src="https://www.youtube.com/game_api/v1"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=960,H=560,TS=40,SC=Math.min(2,window.devicePixelRatio||1);cv.width=W*SC;cv.height=H*SC;
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

// ---------- Audio ----------
let AC,mute=false,isMus=false,audioEnabled=true,playablesPaused=false,rafId=0,cloudLoaded=false,firstFrameSent=false,gameReadySent=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended'&&audioEnabled&&!playablesPaused)AC.resume();return AC}
function tone(f,d,type='square',v=.06,sl=0,dl=0){if(!audioEnabled||playablesPaused||mute||(!set.fx&&!isMus))return;const a=ac();if(!a)return;try{const t=a.currentTime+dl,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}catch(e){}}
function noise(d,v=.15,fc=1200){if(!audioEnabled||playablesPaused||mute||(!set.fx&&!isMus))return;const a=ac();if(!a)return;try{const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fc;g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}catch(e){}}
const SFX={jump:()=>tone(330,.16,'square',.04,380),land:()=>noise(.08,.08,500),die:()=>{noise(.5,.3,1800);tone(220,.5,'sawtooth',.1,-180);tone(60,.6,'sine',.2,-30)},pop:()=>{tone(900,.1,'sawtooth',.06,-600);noise(.1,.1,3000)},slam:()=>{noise(.6,.35,350);tone(70,.5,'sine',.25,-40)},crumble:()=>noise(.35,.12,700),bounce:()=>tone(200,.3,'sine',.1,900),whoosh:()=>{noise(.35,.1,2500);tone(400,.3,'triangle',.05,600)},win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.08,0,i*.1)),click:()=>tone(700,.06,'square',.04),bump:()=>{tone(150,.1,'square',.07);noise(.08,.1,900)}};
const MUS=[[55,55,65,49],[49,49,58,55],[62,62,73,55],[41,41,49,46],[58,58,69,52]];let stp=0;
const musicTick=()=>{if(playablesPaused||!AC||!audioEnabled||mute||!set.mu||state!='play')return;isMus=true;setTimeout(()=>{isMus=false},0);const b=MUS[LV[lv].th];if(stp%2==0)tone(b[(stp>>3)%4]*2,.3,'triangle',.05);if(stp%4==0)tone(110,.1,'sine',.1,-80);if(stp%8==6)tone(b[(stp>>3)%4]*8,.12,'square',.012);stp++};
let musicTimer=0;
function startMusicTimer(){if(!musicTimer)musicTimer=setInterval(musicTick,230)}
function stopMusicTimer(){if(musicTimer){clearInterval(musicTimer);musicTimer=0}}
startMusicTimer();

// ---------- Themes / levels ----------
const TH=[{n:'Dungeon',sky:['#0d0a1f','#241046','#3b1a5e'],far:'#1a1233',mid:'#2a1d4d',t:['#6a58a8','#3f3170','#241a45'],ac:'#a98bff',lt:'#ff9a3c',pt:'#ffb86b',pn:'ember',gl:'#6a3bff'},
{n:'Forest',sky:['#0b2224','#1b5a45','#8fe3a4'],far:'#0e3b33',mid:'#14523f',t:['#8a5e36','#5d3f24','#3a2615'],ac:'#6bd46b',lt:'#ffe08a',pt:'#e6ff8a',pn:'fly',gl:'#c8ff7a'},
{n:'Ice Cave',sky:['#07162e','#164a7a','#8fdcff'],far:'#12406e',mid:'#2a6fa5',t:['#cdeeff','#82c6ec','#4a8fbf'],ac:'#ffffff',lt:'#7fe6ff',pt:'#ffffff',pn:'snow',gl:'#7fe6ff'},
{n:'Lava Forge',sky:['#1a0505','#5a1008','#d2470c'],far:'#2a0a07',mid:'#4a140b',t:['#7a4a38','#4a2519','#2a120c'],ac:'#ff6a1a',lt:'#ff7a1a',pt:'#ffb347',pn:'ember',gl:'#ff5a1a'},
{n:'Void',sky:['#02010a','#0c0638','#2f0e78'],far:'#12094a',mid:'#1c0f6b',t:['#4a3fb0','#2a207a','#150f45'],ac:'#ff3df2',lt:'#7df9ff',pt:'#ffffff',pn:'star',gl:'#ff3df2'}];
const E='#'+'.'.repeat(22)+'#',WL='#'.repeat(24);
function L(name,th,hint,o){const r=[];for(let i=0;i<14;i++)r.push(o[i]||(i==0||i==13?WL:E));return{name,th,hint,r}}
const LV=[
L('Welcome',0,'Easy. Totally safe.',{12:'#P..S...^^....S...F..D.#'}),
L('Look Up',0,'Keep moving. Never stop.',{1:'#.....T.....T..........#',12:'#P....................D#',13:'######CCCC##############'}),
L('Run Away',1,'Doors have legs.',{12:'#.Y..S...P....S.....R..#'}),
L('Rotten Bridge',1,'Floors are temporary.',{12:'#P...^.......S.....^..D#',13:'#######CCCCC####CCCCC###'}),
L('Island Hopper',2,'Mind the gap. And the air.',{9:'#..........I...........#',10:'#.P...........S......D..#',11:'####...###...###...#####',13:E}),
L('Sawmill',2,'Timing is everything.',{12:'#P.....O...S...O......D#'}),
L('Lava Tower',3,'Up, up, and away.',{2:'#.......D..............#',3:'#......####............#',4:'#............###.......#',6:'#................###...#',8:'#............###.......#',10:'#........###...........#',12:'#P...###...............#'}),
L('Lies',3,'Trust nothing.',{7:'#..........S.D.........#',8:'#........######........#',12:'#P...B.........F..F.F..#'}),
L('Event Horizon',4,'Mind the bridge.',{1:'#....T.................#',10:'#...........S..........#',11:'#..........##....W.....#',12:'#P...............W.^F.D#',13:'#########......#########'}),
L('Rain of Rocks',0,'Stones fall. Feet move.',{1:'#.....T..T..T..T..T....#',12:'#P.........S..........D#'}),
L('Staircase of Lies',1,'Every step is a lie.',{8:'#..................F.D.#',9:'#...............S.######',10:'#...........S.##########',11:'#.......S.##############',12:'#P....##################'}),
L('Sky Bridge',2,'Look before you leap.',{6:'#....................D.#',7:'#..................#####',8:'#..........S.O.##......#',9:'#.........###..........#',10:'#.P...##...............#',11:'####...................#',13:E}),
L('Magma Run',3,'The floor is lava. Literally.',{12:'#P....O..S.....O...S..D#',13:'#####CCCCCC####CCCCCCC##'}),
L('Void Walk',4,'Do not look down. Or up.',{1:'#......T....T...T......#',10:'#.P..................D.#',11:'####..###..##..###..####',13:E}),
L('Echoes',0,'Go back. Then forward.',{11:'#..............W.......#',12:'#.Y...S....P...W..S..R.#'}),
L('Jungle Gym',1,'Climb. Do not linger.',{7:'#...........CCC........#',8:'#.......S..............#',9:'#......###.......###...#',10:'#.P...................D#',11:'#####................###',13:E}),
L('Frozen Gauntlet',2,'Up is the only way.',{6:'#..........O..S..D.....#',7:'#.....############.....#',12:'#P..B....^^^.......F...#'}),
L('Furnace',3,'Walls grow. Rocks fall.',{1:'#....T....T....T.......#',11:'#.......W....W....W....#',12:'#P......W....W....W..D.#'}),
L('Zero Gravity',4,'Invisible. Inevitable.',{8:'#...........O..........#',9:'#....I...........I.....#',10:'#.P.....S.....S......D.#',11:'####...###...###...#####',13:E}),
L('Spike Pit',0,'Do not touch the floor.',{10:'#..............S.......#',11:'#...###..###..###..###.#',12:'#P.^^^^^^^^^^^^^^^^^^.D#'}),
L('Phantom Floor',1,'Hop. Hop. Hop.',{11:'#.P.........S.........D#',12:'####..CCC..CCC..CCC..###',13:E}),
L('Needle Rain',2,'Rocks above. Spikes below.',{1:'#...T...T...T...T...T..#',12:'#P....^...^...^...^...D#'}),
L('Mirror Maze',3,'Which door is real?',{11:'#.........W............#',12:'#.Y.P..F..W...F..S..R..#'}),
L('Last Dance',4,'Fly. Then run.',{6:'#................S..D..#',7:'#.............########.#',9:'#...........O..........#',12:'#P..^..S..B..^.......F.#'}),
L('Devils Throne',3,'Final trick. Probably.',{1:'#..........T...........#',6:'#...........W.S........#',7:'#......########........#',9:'#................CCC...#',10:'#....................FD#',11:'#....................###',12:'#P..B.^^^^^^^^^^^^^^^###'})];
const TAUNT=['Skill issue.','Did the floor look suspicious?','That was fair. Probably.','The devil laughs.','Try jumping earlier.','Spikes love you.','Nope!','Almost! (not really)','Have you tried not dying?','Trust issues unlocked.','The level says hi.','Ouch. Again?','So close. So dead.'];

// ---------- State ----------
let state='menu',lv=0,grid,solids,ents,doors,P,deaths=0,totT=0,deadT=0,clearT=0,shake=0,flash=0,freeze=0,tt=0,taunt='',tauntT=0,cardT=0,jb=0,bgC,tileC,T1,amb=[],ps=[],rg=[],start=[0,0],T=TH[0];
const keys={left:0,right:0,jump:0};

function mkTile(g,x,y,top,l,r,b){const t=T.t,gr=g.createLinearGradient(0,y,0,y+TS);gr.addColorStop(0,t[0]);gr.addColorStop(.5,t[1]);gr.addColorStop(1,t[2]);g.fillStyle=gr;g.fillRect(x,y,TS,TS);
  for(let k=0;k<2;k++)for(let j=0;j<2;j++){const bx=x+j*20+(k%2?-10:0),by=y+k*20;g.fillStyle='rgba(255,255,255,'+R(.02,.09)+')';g.fillRect(bx+1,by+1,18,18);g.strokeStyle='rgba(0,0,0,.35)';g.strokeRect(bx+.5,by+.5,20,20)}
  if(l){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x,y,3,TS)}if(r){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x+TS-3,y,3,TS)}if(b){g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x,y+TS-4,TS,4)}
  if(top){g.fillStyle=T.ac;g.globalAlpha=.9;g.fillRect(x,y,TS,4);g.globalAlpha=.35;g.fillRect(x,y+4,TS,3);g.globalAlpha=1;
    if(T.n=='Forest'){g.fillStyle='#4fbf55';for(let q=0;q<8;q++)g.fillRect(x+q*5+R(0,2),y-2-R(0,3),2,5)}
    if(T.n=='Lava Forge'||T.n=='Void'){g.shadowColor=T.ac;g.shadowBlur=10;g.fillStyle=T.ac;g.fillRect(x,y,TS,2);g.shadowBlur=0}}}
function mkBG(){const c=mk(W,H),g=c.getContext('2d'),s=g.createLinearGradient(0,0,0,H);T.sky.forEach((k,i)=>s.addColorStop(i/2,k));g.fillStyle=s;g.fillRect(0,0,W,H);
  const gl=g.createRadialGradient(W*.7,H*.3,10,W*.7,H*.3,320);gl.addColorStop(0,T.gl+'88');gl.addColorStop(1,'#0000');g.fillStyle=gl;g.fillRect(0,0,W,H);
  if(T.n=='Void'){for(let i=0;i<160;i++){g.fillStyle='rgba(255,255,255,'+R(.2,1)+')';g.fillRect(R(0,W),R(0,H),R(1,2.2),R(1,2.2))}g.fillStyle='#3a1a8a';g.beginPath();g.arc(720,170,70,0,6.3);g.fill();g.strokeStyle='#ff3df266';g.lineWidth=6;g.beginPath();g.ellipse(720,170,120,26,-.4,0,6.3);g.stroke()}
  const ridge=(col,base,amp,f,sd)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=12)g.lineTo(x,base-(Math.sin(x*f+sd)*amp+Math.sin(x*f*2.7+sd*2)*amp*.5));g.lineTo(W,H);g.fill()};
  ridge(T.far,H*.62,48,.008,R(0,6));
  for(let i=0;i<9;i++){const x=i*115+R(-20,20),h=R(110,230);g.fillStyle=T.mid;
    if(T.n=='Dungeon'){g.fillRect(x,H-h-60,34,h+60);g.beginPath();g.arc(x+17,H-h-60,17,Math.PI,0);g.fill()}
    else if(T.n=='Forest'){for(let k=0;k<4;k++){g.beginPath();g.moveTo(x-34+k*5,H-60-k*38);g.lineTo(x+17,H-60-k*38-70);g.lineTo(x+68-k*5,H-60-k*38);g.fill()}}
    else if(T.n=='Ice Cave'||T.n=='Void'){g.beginPath();g.moveTo(x,H-40);g.lineTo(x+22,H-40-h*1.1);g.lineTo(x+46,H-40);g.fill()}
    else{g.beginPath();g.moveTo(x-50,H-40);g.lineTo(x+20,H-40-h);g.lineTo(x+90,H-40);g.fill()}}
  ridge(T.mid,H*.82,26,.012,R(0,6));return c}
function mkLevelGfx(){bgC=mkBG();tileC=mk(W,H);const g=tileC.getContext('2d'),S=(x,y)=>y>=0&&y<14&&x>=0&&x<24&&grid[y][x]=='#';
  for(let y=0;y<14;y++)for(let x=0;x<24;x++)if(grid[y][x]=='#')mkTile(g,x*TS,y*TS,!S(x,y-1),!S(x-1,y),!S(x+1,y),!S(x,y+1));
  T1=mk(TS,TS);mkTile(T1.getContext('2d'),0,0,true,false,false,false);
  amb=[];for(let i=0;i<70;i++)amb.push({x:R(0,W),y:R(0,H),s:R(1,3),v:R(10,40),ph:R(0,6)})}

function load(i,keepState){lv=i;T=TH[LV[i].th];const m=LV[i];grid=m.r.map((r,y)=>{r=r.padEnd(24,'.').slice(0,24);return y>0&&y<13?'#'+r.slice(1,23)+'#':r});
  solids=[];ents=[];doors=[];let alt=null;ps.length=0;rg.length=0;
  for(let y=0;y<14;y++)for(let x=0;x<24;x++){const c=grid[y][x],px=x*TS,py=y*TS;
    if(c=='#')solids.push({x:px,y:py,w:TS,h:TS,k:0});
    else if(c=='P')start=[px+9,py+TS-32];
    else if(c=='D'||c=='F'||c=='R')doors.push({x:px,y:py,t:c,dodge:0,vis:1,a:1});
    else if(c=='Y')alt=[px,py];
    else if(c=='^')ents.push({t:'sp',x:px,y:py});
    else if(c=='S')ents.push({t:'hs',x:px,y:py,p:0,on:false});
    else if(c=='C'){const e={t:'cr',x:px,y:py,w:TS,h:TS,k:1,s:0,tm:0};ents.push(e);solids.push(e)}
    else if(c=='W'){const e={t:'wl',x:px,y:py,w:TS,h:TS,k:2,on:false,a:0};ents.push(e);solids.push(e)}
    else if(c=='I'){const e={t:'iv',x:px,y:py,w:TS,h:TS,k:3,rev:0};ents.push(e);solids.push(e)}
    else if(c=='B')ents.push({t:'pad',x:px,y:py,sq:0});
    else if(c=='O')ents.push({t:'saw',bx:px+20,cx:px+20,cy:py+20,ph:R(0,6),r:0});
    else if(c=='T'){let fy=13*TS-TS;for(let yy=y+1;yy<14;yy++)if('#C'.includes(grid[yy][x])){fy=yy*TS-TS;break}ents.push({t:'th',x:px,y:py,y0:py,fy,s:0,tm:0,vy:0})}}
  for(const d of doors)if(d.t=='R')d.alt=alt||[d.x-200,d.y];
  P={x:start[0],y:start[1],vx:0,vy:0,w:22,h:32,g:false,f:1,ph:0,co:0,sq:0,bl:0,sc:Array.from({length:6},()=>({x:start[0],y:start[1]+10}))};
  mkLevelGfx();cardT=2.4;if(!keepState)state='play'}
function startGame(i=0){ac();SFX.click();deaths=0;totT=0;load(i);state='play'}

// ---------- FX ----------
function pt(x,y,vx,vy,l,s,c,g=700,add){if(ps.length>800)ps.shift();ps.push({x,y,vx,vy,l,t:0,s,c,g,add})}
function burst(x,y,n,cols,sp,l,s,g,add){for(let i=0;i<n;i++){const a=R(0,6.283),v=R(sp*.25,sp);pt(x,y,Math.cos(a)*v,Math.sin(a)*v-sp*.25,l*R(.6,1.3),s*R(.5,1.4),cols[i%cols.length],g,add)}}
const ring=(x,y,m,c,l=.5)=>rg.push({x,y,r:4,m,c,l,t:0});
function die(msg){if(state!='play')return;state='dead';deadT=1.1;deaths++;taunt=msg||TAUNT[Math.floor(Math.random()*TAUNT.length)];tauntT=1.2;
  const cx=P.x+11,cy=P.y+16;burst(cx,cy,40,['#6d7bff','#ffe3c4','#e63946','#241b3d'],520,.9,6,900);burst(cx,cy,26,['#ff7a1a','#ffd166','#fff'],700,.6,5,300,true);ring(cx,cy,150,'#ff5a3a',.6);ring(cx,cy,90,'#ffd166',.45);
  shake=16;flash=.55;freeze=.08;SFX.die()}
function win(){if(state!='play')return;state='clear';if(lv+1>maxLv){maxLv=Math.min(25,lv+1)}saveP();clearT=1.7;const cx=P.x+11,cy=P.y+16;burst(cx,cy,60,['#ffd166','#7df9ff','#ff3df2','#6bd46b'],620,1.2,6,500,true);ring(cx,cy,200,'#ffd166',.8);SFX.win();shake=5}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

// ---------- Update ----------
function update(dt){
  if(freeze>0){freeze-=dt;dt*=.08}
  tt+=dt;shake*=Math.pow(.003,dt);flash=Math.max(0,flash-dt*1.6);cardT-=dt;tauntT-=dt;
  for(const p of ps){p.t+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}ps=ps.filter(p=>p.t<p.l);
  for(const r of rg){r.t+=dt;r.r=r.m*Math.min(1,r.t/r.l*1.6)}rg=rg.filter(r=>r.t<r.l);
  for(const a of amb){a.y+=(T.pn=='snow'?a.v:T.pn=='star'?0:-a.v)*dt;a.x+=Math.sin(tt+a.ph)*12*dt;if(a.y<-10)a.y=H+10;if(a.y>H+10)a.y=-10}
  if(state=='dead'){deadT-=dt;if(deadT<=0){load(lv,true);state='play';cardT=0}return}
  if(state=='clear'){clearT-=dt;if(clearT<=0){if(lv>=LV.length-1)state='end';else load(lv+1)}return}
  if(state!='play')return;
  totT+=dt;jb-=dt;
  const dir=keys.right-keys.left,acc=P.g?2800:1700;
  if(dir){const tx=dir*250;P.vx+=clamp(tx-P.vx,-acc*dt,acc*dt);P.f=dir}else P.vx*=Math.exp(-(P.g?16:3)*dt);
  P.co-=dt;if(P.g)P.co=.09;
  if(jb>0&&P.co>0){P.vy=-640;P.co=0;jb=0;P.g=false;P.sq=-.4;SFX.jump();burst(P.x+11,P.y+32,6,['#ddd','#aaa'],110,.4,4,100)}
  if(!keys.jump&&P.vy<-200)P.vy+=2200*dt;
  P.vy=Math.min(900,P.vy+1800*dt);P.sq*=Math.pow(.01,dt);
  const act=s=>!(s.k==1&&s.s==2)&&!(s.k==2&&!s.on);
  P.x+=P.vx*dt;for(const s of solids)if(act(s)&&hit(P,s)){if(P.vx>0)P.x=s.x-P.w;else if(P.vx<0)P.x=s.x+s.w;P.vx=0}
  P.y+=P.vy*dt;const was=P.g;P.g=false;

// ---------- Input / loop ----------
addEventListener('keydown',e=>{if(playablesPaused)return;ac();const c=e.code;if(c=='ArrowLeft'||c=='KeyA')keys.left=1;else if(c=='ArrowRight'||c=='KeyD')keys.right=1;else if(c=='ArrowUp'||c=='KeyW'||c=='Space'){if(!keys.jump)jb=.12;keys.jump=1;e.preventDefault()}else if(c=='KeyR'&&state=='play')die('Restarted. Coward.');else if(c=='KeyM'&&!inPlayables())mute=!mute;else if(c=='Enter'&&(state=='menu'||state=='end'))startGame();else if(state=='menu'&&/^Digit[1-9]$/.test(c))startGame(+c[5]-1);if(c.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{if(playablesPaused)return;const c=e.code;if(c=='ArrowLeft'||c=='KeyA')keys.left=0;if(c=='ArrowRight'||c=='KeyD')keys.right=0;if(c=='ArrowUp'||c=='KeyW'||c=='Space')keys.jump=0});
let maxLv=0,prevS='menu',set={fx:1,mu:1,sh:1};const UI=[];
const inPlayables=()=>typeof ytgame!=='undefined'&&!!ytgame.IN_PLAYABLES_ENV;
if(!inPlayables()){try{maxLv=+localStorage.getItem('dg_max')||0;Object.assign(set,JSON.parse(localStorage.getItem('dg_set')||'{}'))}catch(e){}}
let saveQueue=Promise.resolve();
const saveP=()=>{
  if(inPlayables()){
    if(!cloudLoaded||!ytgame?.game?.saveData)return;
    const data=JSON.stringify({version:1,maxLv:Math.max(0,Math.min(25,maxLv)),settings:{fx:!!set.fx,mu:!!set.mu,sh:!!set.sh}});
    saveQueue=saveQueue.then(()=>ytgame.game.saveData(data)).catch(()=>{});
  }else{try{localStorage.setItem('dg_max',maxLv);localStorage.setItem('dg_set',JSON.stringify(set))}catch(e){}}
};
async function loadPlayableSave(){
  if(!inPlayables()){cloudLoaded=true;return}
  try{
    const raw=await ytgame.game.loadData();
    if(raw){const d=JSON.parse(raw);if(Number.isFinite(d.maxLv))maxLv=Math.max(0,Math.min(25,Math.floor(d.maxLv)));if(d.settings&&typeof d.settings==='object')Object.assign(set,{fx:d.settings.fx?1:0,mu:d.settings.mu?1:0,sh:d.settings.sh?1:0})}
    cloudLoaded=true;
  }catch(e){cloudLoaded=false;try{ytgame.health?.logWarning?.()}catch(_){}}
}
function setupPlayableLifecycle(){
  if(!inPlayables())return;
  try{
    audioEnabled=ytgame.system.isAudioEnabled();
    ytgame.system.onAudioEnabledChange(enabled=>{audioEnabled=!!enabled;if(!audioEnabled&&AC)AC.suspend().catch(()=>{});else if(audioEnabled&&!playablesPaused&&AC)AC.resume().catch(()=>{});});
    ytgame.system.onPause(()=>{if(playablesPaused)return;playablesPaused=true;stopMusicTimer();keys.left=keys.right=keys.jump=0;jb=0;if(AC)AC.suspend().catch(()=>{});saveP();if(rafId)cancelAnimationFrame(rafId);rafId=0;});
    ytgame.system.onResume(()=>{if(!playablesPaused)return;playablesPaused=false;last=0;startMusicTimer();if(audioEnabled&&AC)AC.resume().catch(()=>{});if(!rafId)rafId=requestAnimationFrame(loop);});
  }catch(e){try{ytgame.health?.logError?.()}catch(_){}}
}
function pill(x,y,w,h,s,c,fn,sz=20){UI.push({x,y,w,h,fn});ctx.fillStyle=c;rr(ctx,x,y,w,h,h/2);ctx.fill();ctx.strokeStyle='#ffffff66';ctx.lineWidth=2;ctx.stroke();txt(s,x+w/2,y+h/2+sz*.35,sz)}
function icon(cx,cy,kind,fn){UI.push({x:cx-17,y:cy-17,w:34,h:34,fn});ctx.fillStyle='rgba(10,8,30,.75)';ctx.beginPath();ctx.arc(cx,cy,17,0,6.3);ctx.fill();ctx.strokeStyle='#ffffffaa';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';
  if(kind=='gear'){ctx.beginPath();for(let i=0;i<16;i++){const a=i/16*6.283,r=i%2?7:10;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.fillStyle='rgba(10,8,30,.95)';ctx.beginPath();ctx.arc(cx,cy,3.5,0,6.3);ctx.fill()}
  else{for(let i=0;i<3;i++)for(let j=0;j<3;j++)ctx.fillRect(cx-9+i*7,cy-9+j*7,5,5)}}
function ui(){UI.length=0;
  if(state=='play'){icon(W/2-26,20,'map',()=>{prevS='play';state='map'});icon(W/2+26,20,'gear',()=>{prevS='play';state='set'})}
  else if(state=='menu'){icon(W-36,36,'gear',()=>{prevS='menu';state='set'});pill(W/2-110,478,220,46,'LEVEL MAP','#3a86ff',()=>{prevS='menu';state='map'},22)}
  else if(state=='map')drawMap();else if(state=='set')drawSet()}
function drawMap(){ctx.fillStyle='rgba(6,4,18,.96)';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,520);g.addColorStop(0,'#3a2a7a66');g.addColorStop(1,'#0000');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  txt('LEVEL MAP',W/2,50,40,'#ffd166');txt('Cleared: '+Math.min(maxLv,25)+' / 25   (tap an unlocked level)',W/2,76,15,'#cfd3ff');
  const pos=i=>{const r=Math.floor(i/5),k=i%5,c=r%2?4-k:k;return[130+c*175,130+r*78]};
  ctx.lineCap='round';for(let i=0;i<LV.length-1;i++){const a=pos(i),b=pos(i+1);ctx.strokeStyle=i<maxLv?'#ffd166':'#ffffff22';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
  const cur=Math.min(maxLv,LV.length-1);
  for(let i=0;i<LV.length;i++){const[x,y]=pos(i),un=i<=cur,dn=i<maxLv;
    if(un)UI.push({x:x-26,y:y-26,w:52,h:52,fn:()=>startGame(i)});
    if(i==cur){ctx.save();ctx.globalCompositeOperation='lighter';glow(x,y,52+Math.sin(tt*4)*6,'#7df9ff','66');ctx.restore()}
    ctx.fillStyle=dn?'#ffd166':un?'#1d2a5e':'#2a2a3a';ctx.beginPath();ctx.arc(x,y,24,0,6.3);ctx.fill();ctx.strokeStyle=un?TH[LV[i].th].ac:'#555';ctx.lineWidth=4;ctx.stroke();
    txt(un?String(i+1):'🔒',x,y+7,un?22:17,dn?'#2a1a00':'#fff','center',dn?'#fff0':'#000');
    if(dn)txt('✓',x+19,y-15,16,'#2ecc71');
    txt(LV[i].name,x,y+42,11,un?'#cfd3ff':'#666')}
  pill(W/2-80,505,160,38,'◀ BACK','#e63946',()=>{state=prevS=='play'?'play':'menu'},19)}
function drawSet(){ctx.fillStyle='rgba(6,4,18,.9)';ctx.fillRect(0,0,W,H);
  const x0=W/2-250,y0=60;ctx.fillStyle='#14102e';rr(ctx,x0,y0,500,430,22);ctx.fill();ctx.strokeStyle='#a98bff';ctx.lineWidth=3;ctx.stroke();
  txt('SETTINGS',W/2,y0+56,38,'#ffd166');
  [['Sound Effects','fx'],['Music','mu'],['Screen Shake','sh']].forEach((r,i)=>{const y=y0+90+i*62,on=set[r[1]];txt(r[0],x0+34,y+30,22,'#fff','left');
    UI.push({x:x0+340,y,w:126,h:42,fn:()=>{set[r[1]]=on?0:1;saveP();SFX.click()}});ctx.fillStyle=on?'#2ecc71':'#555';rr(ctx,x0+340,y,126,42,21);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(on?x0+445:x0+361,y+21,16,0,6.3);ctx.fill();txt(on?'ON':'OFF',on?x0+386:x0+420,y+28,17,'#fff')});
  if(!inPlayables())pill(x0+34,y0+288,205,42,'Unlock All Levels','#3a86ff',()=>{maxLv=25;saveP()},16);
  pill(x0+262,y0+288,205,42,'Reset Progress','#8a2be2',()=>{maxLv=0;saveP()},16);
  pill(W/2-90,y0+358,180,46,prevS=='play'?'RESUME':'CLOSE','#e63946',()=>{state=prevS},22)}
cv.addEventListener('pointerdown',e=>{if(playablesPaused)return;ac();const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  for(let i=UI.length-1;i>=0;i--){const b=UI[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){SFX.click();b.fn();return}}
  if(state=='menu'||state=='end')startGame()});
addEventListener('keydown',e=>{if(e.code=='Escape'){if(state=='play'){prevS='play';state='set'}else if(state=='set')state=prevS;else if(state=='map')state=prevS=='play'?'play':'menu'}});
document.querySelectorAll('.tb').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{if(playablesPaused)return;e.preventDefault();ac();if(k=='jump'&&!keys.jump)jb=.12;keys[k]=1});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))});
load(0,true);state='menu';
let last=0;
function loop(t){
  rafId=0;
  if(playablesPaused)return;
  const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();
  if(inPlayables()&&!firstFrameSent){
    try{ytgame.game.firstFrameReady();firstFrameSent=true;}catch(e){}
  }
  if(inPlayables()&&firstFrameSent&&!gameReadySent){
    try{ytgame.game.gameReady();gameReadySent=true;}catch(e){}
  }
  if(!rafId)rafId=requestAnimationFrame(loop);
}
setupPlayableLifecycle();
(async()=>{
  await loadPlayableSave();
  if(!rafId)rafId=requestAnimationFrame(loop);
})();
</script></body></html>
